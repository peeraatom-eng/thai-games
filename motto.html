
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกมทายคำขวัญ 77 จังหวัด</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  font-family:Tahoma,"Noto Sans Thai",sans-serif;
  background:linear-gradient(135deg,#e5f3ff,#f7e9ff,#fff4e4);
  color:#29334a;min-height:100vh;
  display:flex;justify-content:center;align-items:center
}
.card{
  width:100%;max-width:620px;background:white;
  padding:26px;border-radius:24px;
  box-shadow:0 12px 40px #44557720;text-align:center
}
h1{color:#7354b8;margin-top:0}
.sub{color:#778096}
.stats{display:flex;justify-content:space-around;gap:8px;margin:20px 0}
.stat{background:#f2edff;border-radius:14px;padding:12px;flex:1}
.stat b{display:block;font-size:22px;color:#7354b8}
.slogan{
  background:#fff7e8;border-radius:18px;padding:24px 16px;
  margin:18px 0;font-size:21px;line-height:1.8
}
input{
  width:100%;padding:15px;font-size:18px;
  border:2px solid #ded6f4;border-radius:12px;outline:none
}
input:focus{border-color:#8b70d0}
button{
  border:0;border-radius:12px;padding:13px 17px;
  font-size:16px;cursor:pointer;font-weight:bold
}
button:disabled{opacity:.5;cursor:default}
.primary{background:#7956c7;color:white}
.secondary{background:#eee8ff;color:#6146a1}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1}
#feedback{min-height:48px;line-height:1.7;margin:14px 0}
.green{color:#218653}.red{color:#c34c58}
.small{font-size:13px;color:#8990a0;margin-top:20px}
.hidden{display:none}
@media(max-width:420px){
 .card{padding:18px}.slogan{font-size:19px}
 .row{flex-wrap:wrap}.row button{min-width:42%}
}
</style>
</head>
<body>
<main class="card">
  <h1>🗺️ ทายคำขวัญจังหวัด</h1>
  <div class="sub">อ่านคำขวัญ แล้วพิมพ์ชื่อจังหวัดให้ถูกต้อง</div>

  <div id="game">
    <div class="stats">
      <div class="stat">ข้อที่<b id="progress">1/77</b></div>
      <div class="stat">คะแนน<b id="score">0</b></div>
      <div class="stat">เหลือ<b id="remaining">77</b></div>
    </div>

    <div class="slogan" id="clue"></div>
    <input id="answer" placeholder="พิมพ์ชื่อจังหวัด..." autocomplete="off">

    <div class="row">
      <button class="primary" id="check">ตรวจคำตอบ</button>
      <button class="secondary" id="skip">ข้ามข้อนี้ →</button>
    </div>
    <div id="feedback" aria-live="polite"></div>
    <button class="secondary" id="next" disabled>ข้อต่อไป →</button>
  </div>

  <div id="result" class="hidden">
    <h2>🎉 เล่นครบแล้ว!</h2>
    <p id="summary"></p>
    <button class="primary" id="restart">เล่นอีกครั้ง ↻</button>
  </div>
  <div class="small">Thai Games · เกมฝึกความรู้จังหวัดไทย 🇹🇭</div>
</main>

<script>
const questions = [
["กรุงเทพมหานคร","กรุงเทพฯ ดุจเทพสร้าง เมืองศูนย์กลางการปกครอง วัด วัง งามเรืองรอง เมืองหลวงของประเทศไทย"],
["กระบี่","เมืองน่าอยู่ ผู้คนน่ารัก"],

["กำแพงเพชร","กรุพระเครื่อง เมืองคนแกร่ง พระแสงล้ำค่า ศิลาแลงใหญ่ กล้วยไข่หวาน น้ำมันลานกระบือ เลื่องลือมรดกโลก"],
["ขอนแก่น","พระธาตุขามแก่น เสียงแคนดอกคูน ศูนย์รวมผ้าไหม ร่วมใจผูกเสี่ยว เที่ยวขอนแก่นนครใหญ่ ไดโนเสาร์สิรินธรเน่ สุดเท่เหรียญทองแรกมวยโอลิมปิก"],
["จันทบุรี","น้ำตกลือเลื่อง เมืองผลไม้ พริกไทยพันธุ์ดี อัญมณีมากเหลือ เสื่อจันทบูร สมบูรณ์ธรรมชาติ สมเด็จพระเจ้าตากสินมหาราช รวมญาติกู้ชาติที่จันทบุรี"],
["ฉะเชิงเทรา","แม่น้ำบางปะกงแหล่งชีวิต พระศักดิ์สิทธิ์หลวงพ่อโสธร พระยาศรีสุนทรปราชญ์ภาษาไทย เขาอ่างฤาไนป่าสมบูรณ์"],
["ชลบุรี","ทะเลงาม ข้าวหลามอร่อย อ้อยหวาน จักสานดี ประเพณีวิ่งควาย"],
["ชัยนาท","หลวงปู่ศุขลือชา เขื่อนเจ้าพระยาลือชื่อ นามระบือสวนนก ส้มโอดกขาวแตงกวา"],
["ชัยภูมิ","กำเนิดแม่น้ำชี สดุดีพญาแลผู้กล้า ปรางค์กู่เป็นสง่า ล้ำค่าพระธาตุชัยภูมิ สมบูรณ์ป่าเขาสรรพสัตว์ เด่นชัดลายผ้าไหม ดอกกระเจียวงามลือไกล"],

["เชียงใหม่","ดอยสุเทพเป็นศรี ประเพณีเป็นสง่า บุปผชาติล้วนงามตา นามล้ำค่านครพิงค์"],
["ตรัง","เมืองพระยารัษฎา ชาวประชาใจกว้าง หมูย่างรสเลิศ ถิ่นกำเนิดยางพารา เด่นสง่าดอกศรีตรัง ปะการังใต้ทะเล เสน่ห์หาดทรายงาม น้ำตกสวยตระการตา"],

["นครราชสีมา","เมืองหญิงกล้า ผ้าไหมดี หมี่โคราช ปราสาทหิน ดินด่านเกวียน"],

["นครสวรรค์","เมืองสี่แคว แห่มังกร พักผ่อนบึงบอระเพ็ด ปลารสเด็ดปากน้ำโพ"],
["นนทบุรี","พระตำหนักสง่างาม ลือนามสวนสมเด็จ เกาะเกร็ดแหล่งดินเผา วัดเก่านามระบือ เลื่องลือทุเรียนนนท์ งามน่ายลศูนย์ราชการ"],
["นราธิวาส","ทักษิณราชตำหนัก ชนรักศาสนา นราทัศน์เพลินตา ปาโจตรึงใจ แหล่งใหญ่แร่ทอง ลองกองหอมหวาน"],
["น่าน","แข่งเรือลือเลื่อง เมืองงาช้างดำ จิตรกรรมวัดภูมินทร์ แดนดินส้มสีทอง เรืองรองพระธาตุแช่แห้ง"],
["บึงกาฬ","ภูทอกแหล่งพระธรรม ค่าล้ำยางพารา งามตาแก่งอาฮง บึงโขงหลงเพลินใจ น้ำตกใสเจ็ดสี ประเพณีแข่งเรือ เหนือสุดแดนอีสาน"],
["บุรีรัมย์","เมืองปราสาทหิน ถิ่นภูเขาไฟ ผ้าไหมสวย รวยวัฒนธรรม เลิศล้ำเมืองกีฬา"],
["ปทุมธานี","ถิ่นบัวหลวง เมืองรวงข้าว เชื้อชาวมอญ นครธรรมะ พระตำหนักรวมใจ สดใสเจ้าพระยา ก้าวหน้าอุตสาหกรรม"],
["ประจวบคีรีขันธ์","เมืองทองเนื้อเก้า มะพร้าว สับปะรดสวยสด หาด เขา ถ้ำ งามล้ำน้ำใจ"],
["ปราจีนบุรี","ศรีมหาโพธิคู่บ้าน ไผ่ตงหวานคู่เมือง ผลไม้ลือเลื่อง เขตเมืองทวารวดี"],
["ปัตตานี","เมืองงามสามวัฒนธรรม ศูนย์ฮาลาลเลิศล้ำ ชนน้อมนำศรัทธา ถิ่นธรรมชาติงามตา ปัตตานีสันติสุขแดนใต้"],
["พระนครศรีอยุธยา","ราชธานีเก่า อู่ข้าวอู่น้ำ เลิศล้ำกานท์กวี คนดีศรีอยุธยา เลอคุณค่ามรดกโลก"],
["พังงา","แร่หมื่นล้าน บ้านกลางน้ำ ถ้ำงามตา ภูผาแปลก แมกไม้จำปูน บริบูรณ์ทรัพยากร"],
["พัทลุง","เมืองหนังโนรา อู่นาข้าว พราวน้ำตก แหล่งนกน้ำ ทะเลสาบงาม เขาอกทะลุ น้ำพุร้อน"],
["พิจิตร","เมืองชาละวัน แข่งขันเรือยาว ข้าวเจ้าอร่อย ส้มท่าข่อยรสเด็ด หลวงพ่อเพชรรวมใจ บึงสีไฟลือเลื่อง ยอดพระเครื่องหลวงพ่อเงิน"],
["พิษณุโลก","เมืองสองแคว แคว้นพระนเรศวร แหล่งกำเนิดพระพุทธชินราช"],
["เพชรบุรี","เขาวังคู่บ้าน ขนมหวานเมืองพระ เลิศล้ำศิลปะ แดนธรรมะ ทะเลงาม"],
["เพชรบูรณ์","เมืองมะขามหวาน อุทยานน้ำหนาว ศรีเทพเมืองเก่า เขาค้ออนุสรณ์ นครพ่อขุนผาเมือง"],

["ยะลา","ใต้สุดสยาม เมืองงามชายแดน"],
["ร้อยเอ็ด","สิบเอ็ดประตูเมืองงาม เรืองนามพระสูงใหญ่ ผ้าไหมสาเกต บุญผะเหวดประเพณี มหาเจดีย์ชัยมงคล งามน่ายลบึงพลาญชัย เขตกว้างไกลทุ่งกุลา"],

["ระยอง","ผลไม้รสล้ำ อุตสาหกรรมก้าวหน้า น้ำปลารสเด็ด เกาะเสม็ดสวยหรู"],

["สตูล","สตูล สงบ สะอาด ธรรมชาติบริสุทธิ์"],
["สมุทรปราการ","ป้อมยุทธนาวี พระเจดีย์กลางน้ำ ฟาร์มจระเข้ใหญ่ งามวิไลเมืองโบราณ สงกรานต์พระประแดง ปลาสลิดแห้งรสดี ประเพณีรับบัว ครบถ้วนทั่วอุตสาหกรรม"],
