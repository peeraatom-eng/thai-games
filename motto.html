
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกมทายคำขวัญ 77 จังหวัด</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Tahoma, sans-serif;
  background: linear-gradient(135deg,#dbeafe,#fce7f3);
  color: #243047;
}
.card {
  width: 100%;
  max-width: 600px;
  padding: 28px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 10px 35px #64748b30;
  text-align: center;
}
h1 { color: #7c3aed; margin-top: 0; }
#clue {
  background: #f5f3ff;
  border-radius: 16px;
  padding: 22px;
  line-height: 1.9;
  font-size: 19px;
  margin: 20px 0;
}
input {
  width: 100%;
  padding: 14px;
  border: 2px solid #c4b5fd;
  border-radius: 12px;
  font-size: 18px;
  text-align: center;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 16px;
  cursor: pointer;
  margin: 5px;
  background: #7c3aed;
  color: white;
}
button:hover { opacity: .85; }
.secondary { background: #64748b; }
#feedback { min-height: 28px; font-weight: bold; }
.small { color: #64748b; font-size: 14px; }
.hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1>🇹🇭 ทายคำขวัญจังหวัด</h1>
  <p>อ่านคำขวัญ แล้วพิมพ์ชื่อจังหวัดให้ถูกต้อง</p>

  <div id="game">
    <p id="progress">ข้อ 1</p>
    <p id="score">คะแนน 0</p>
    <div id="clue">กำลังโหลดคำถาม...</div>
    <form id="answerForm">
      <input id="answerInput" placeholder="พิมพ์ชื่อจังหวัด..." autocomplete="off" required>
      <button type="submit">ตรวจคำตอบ</button>
    </form>
    <p id="feedback" aria-live="polite"></p>
    <button id="nextBtn" class="secondary hidden">ข้อต่อไป →</button>
    <button id="skipBtn" class="secondary">ข้ามข้อนี้</button>
  </div>

  <div id="result" class="hidden">
    <h2>จบเกมแล้ว! 🎉</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">เล่นอีกครั้ง</button>
  </div>
  <p class="small">เกมฝึกความจำคำขวัญจังหวัด</p>
</main>

<script>
// ข้อมูลตัวอย่าง 12 จังหวัด
// เพิ่มคำขวัญที่ตรวจสอบแล้วได้ในรายการนี้
const questions = [
  { clue: "ดอยสุเทพเป็นศรี ประเพณีเป็นสง่า บุปผชาติล้วนงามตา นามล้ำค่านครพิงค์", answer: "เชียงใหม่" },
  { clue: "เมืองหญิงกล้า ผ้าไหมดี หมี่โคราช ปราสาทหิน ดินด่านเกวียน", answer: "นครราชสีมา" },
  { clue: "ทะเลงาม ข้าวหลามอร่อย อ้อยหวาน จักสานดี ประเพณีวิ่งควาย", answer: "ชลบุรี" },
  { clue: "เมืองมะขามหวาน อุทยานน้ำหนาว ศรีเทพเมืองเก่า เขาค้ออนุสรณ์ นครพ่อขุนผาเมือง", answer: "เพชรบูรณ์" },
  { clue: "ไข่มุกอันดามัน สวรรค์เมืองใต้ หาดทรายสีทอง สองวีรสตรี บารมีหลวงพ่อแช่ม", answer: "ภูเก็ต" },
  { clue: "เมืองในฝันที่ใกล้กรุง ภูเขางาม น้ำตกสวย รวยธรรมชาติปราศจากมลพิษ", answer: "นครนายก" },
  { clue: "เมืองร้อยเกาะ เงาะอร่อย หอยใหญ่ ไข่แดง แหล่งธรรมะ", answer: "สุราษฎร์ธานี" },
  { clue: "พระธาตุพนมค่าล้ำ วัฒนธรรมหลากหลาย เรณูผู้ไท เรือไฟโสภา งามตาฝั่งโขง", answer: "นครพนม" },
  { clue: "ถ่านหินลือชา รถม้าลือลั่น เครื่องปั้นลือนาม งามพระธาตุลือไกล ฝึกช้างใช้ลือโลก", answer: "ลำปาง" },
  { clue: "เมืองชาละวัน แข่งขันเรือยาว ข้าวเจ้าอร่อย ส้มท่าข่อยรสเด็ด บึงสีไฟลือเลื่อง", answer: "พิจิตร" },
  { clue: "เมืองหอยหลอด ยอดลิ้นจี่ มีอุทยาน ร.2 แม่กลองไหลผ่าน นมัสการหลวงพ่อบ้านแหลม", answer: "สมุทรสงคราม" },
  { clue: "ใต้สุดแดนสยาม เมืองงามชายแดน", answer: "ยะลา" }
];

const $ = id => document.getElementById(id);
let order = [];
let current = 0;
let score = 0;
let answered = false;

function normalize(text) {
  return text.trim().replace(/\s+/g, "").toLowerCase();
}

function startGame() {
  order = questions.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  score = 0;
  $("game").classList.remove("hidden");
  $("result").classList.add("hidden");
  showQuestion();
}

function showQuestion() {
  if (current >= order.length) {
    finishGame();
    return;
  }

  answered = false;
  const q = questions[order[current]];
  $("progress").textContent =
    `ข้อ ${current + 1} / ${order.length}`;
  $("score").textContent = `คะแนน ${score}`;
  $("clue").textContent = q.clue;
  $("answerInput").value = "";
  $("answerInput").disabled = false;
  $("feedback").textContent = "";
  $("nextBtn").classList.add("hidden");
  $("skipBtn").classList.remove("hidden");
  $("answerInput").focus();
}

$("answerForm").addEventListener("submit", function(event) {
  event.preventDefault();
  if (answered) return;

  const guess = normalize($("answerInput").value);
  const correct = normalize(questions[order[current]].answer);

  if (!guess) return;

  answered = true;
  $("answerInput").disabled = true;
  $("skipBtn").classList.add("hidden");

  if (guess === correct) {
    score++;
    $("feedback").textContent = "ถูกต้อง! 🎉";
    $("feedback").style.color = "#15803d";
  } else {
    $("feedback").textContent =
      `ยังไม่ถูกนะ คำตอบคือ ${questions[order[current]].answer}`;
    $("feedback").style.color = "#dc2626";
  }

  $("score").textContent = `คะแนน ${score}`;
  $("nextBtn").classList.remove("hidden");
  $("nextBtn").focus();
});

$("nextBtn").addEventListener("click", function() {
  current++;
  showQuestion();
});

$("skipBtn").addEventListener("click", function() {
  if (answered) return;
  answered = true;
  $("feedback").textContent =
    `ข้อนี้คือ ${questions[order[current]].answer}`;
  $("feedback").style.color = "#64748b";
  $("answerInput").disabled = true;
  $("skipBtn").classList.add("hidden");
  $("nextBtn").classList.remove("hidden");
});

function finishGame() {
  $("game").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("finalScore").textContent =
    `คุณได้ ${score} จาก ${questions.length} คะแนน`;
}

$("restartBtn").addEventListener("click", startGame);

startGame();
</script>
</body>
</html>
